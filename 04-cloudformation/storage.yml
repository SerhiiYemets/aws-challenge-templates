AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Challenge reusable RDS MySQL and EFS storage

Parameters:
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  EfsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  DBName:
    Type: String
    Default: gitea

  DBUsername:
    Type: String
    Default: giteaadmin

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Gitea RDS
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      Tags:
        - Key: Name
          Value: challenge-db-subnet-group

  GiteaDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: challenge-gitea-db
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: challenge-gitea-db

  GiteaFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: challenge-gitea-efs

  EfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref GiteaFileSystem
      SubnetId: !Ref PrivateSubnet1Id
      SecurityGroups:
        - !Ref EfsSecurityGroupId

  EfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref GiteaFileSystem
      SubnetId: !Ref PrivateSubnet2Id
      SecurityGroups:
        - !Ref EfsSecurityGroupId

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt GiteaDatabase.Endpoint.Address

  DatabasePort:
    Value: !GetAtt GiteaDatabase.Endpoint.Port

  DatabaseName:
    Value: !Ref DBName

  DatabaseUsername:
    Value: !Ref DBUsername

  FileSystemId:
    Value: !Ref GiteaFileSystem

  MountTarget1Id:
    Value: !Ref EfsMountTarget1

  MountTarget2Id:
    Value: !Ref EfsMountTarget2
